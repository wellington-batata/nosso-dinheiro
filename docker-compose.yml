services:
  db:
    image: postgres:16
    container_name: ${DB_CONTAINER_NAME}
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: ${API_CONTAINER_NAME}
    restart: always
    env_file: .env
    depends_on:
      - db
    ports:
      - "8000:8000"

volumes:
  db_data:

  
